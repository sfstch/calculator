<!doctype html>
<html>
  <head>
    <meta charset="UTF8" />
    <link rel="stylesheet" href="calculator.css" />
    <script
      src="https://kit.fontawesome.com/5bfe23d569.js"
      crossorigin="anonymous"
    ></script>
    <script src="js/functions.js"></script>
    <script src="js/calculator.js"></script>
    <title>calculator</title>
  </head>
  <body>
    <div class="calculator-form">
      <div class="input-fields">
        <input
          type="number"
          id="numeral1"
          name="numeral-1"
          placeholder="введите знчение"
        />
        <input
          type="number"
          id="numeral2"
          name="numeral-2"
          placeholder="введите знчение"
        />
        <span
          class="tooltip"
          data-tooltip="1. введите значения в левое поле и правое поле 2. нажмите кнопку с необходимой операцией"
        >
          <i class="fa-solid fa-circle-info"></i>
        </span>
      </div>
      <div class="buttons-math-operations">
        <button id="additionBtn" name="add" disabled>
          <i class="fa-solid fa-plus"></i>
        </button>
        <button id="subtractionBtn" name="sub" disabled>
          <i class="fa-solid fa-minus"></i>
        </button>
        <button id="multiplicationBtn" name="multi" disabled>
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button id="divisionBtn" name="divi" disabled>
          <i class="fa-solid fa-divide"></i>
        </button>
        <button id="exponentiationBtn" name="expo" disabled>
          <i class="fa-solid fa-superscript"></i>
        </button>
        <button id="remainderBtn" name="rem" disabled>
          <i class="fa-solid fa-percent"></i>
        </button>
      </div>
      <output id="result" type="number"></output>
    </div>
  </body>
</html>
