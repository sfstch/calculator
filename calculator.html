<!doctype html>
<html>
  <head>
    <meta charset="UTF8" />
    <link rel="stylesheet" href="calculator.css" />
    <script
      src="https://kit.fontawesome.com/5bfe23d569.js"
      crossorigin="anonymous"
    ></script>
    <script src="js/functions.js"></script>
    <script src="js/calculator.js"></script>
    <title>calculator</title>
  </head>
  <body>
    <div class="calculator-container">
      <div class="calculator-form">
        <div class="input-fields">
          <input type="number" id="numeral1" name="numeral-1" />
          <input type="number" id="numeral2" name="numeral-2" />
        </div>
        <div class="buttons-math-operations">
          <button id="additionBtn" class="addition" disabled>
            <i class="fa-solid fa-plus"></i>
          </button>
          <button id="subtractionBtn" class="subtraction" disabled>
            <i class="fa-solid fa-minus"></i>
          </button>
          <button id="multiplicationBtn" class="multiplication" disabled>
            <i class="fa-solid fa-xmark"></i>
          </button>
          <button id="divisionBtn" class="division" disabled>
            <i class="fa-solid fa-divide"></i>
          </button>
          <button id="exponentiationBtn" class="exponentiation" disabled>
            <i class="fa-solid fa-superscript"></i>
          </button>
          <button id="remainderBtn" class="remainder" disabled>
            <i class="fa-solid fa-percent"></i>
          </button>
        </div>
        <output id="result" type="number"></output>
      </div>
    </div>
  </body>
</html>
